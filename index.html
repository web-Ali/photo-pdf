<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фото в PDF</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #dde1e7; --accent: #2563eb; --accent-text: #fff; --err: #b42318; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --text: #e8eaee; --muted: #9aa1ad;
      --line: #333842; --accent: #4f8cff; --accent-text: #fff; --err: #ff8a80; --ok: #6ee7a8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); }

  .drop { display: flex; flex-direction: column; align-items: center; gap: 4px;
          padding: 28px 16px; border: 2px dashed var(--line); border-radius: 12px;
          background: var(--card); cursor: pointer; text-align: center; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop span { color: var(--muted); font-size: 13px; }

  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 12px; margin: 16px 0; }
  .item { position: relative; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .item.dragging { opacity: .4; }
  .item.target { outline: 2px solid var(--accent); }
  .thumb { height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; transition: transform .15s; }
  .num { position: absolute; top: 6px; left: 6px; background: var(--accent); color: var(--accent-text);
         font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
  .fname { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 4px; }
  .btns button { flex: 1; padding: 4px 0; border: 1px solid var(--line); border-radius: 6px;
                 background: transparent; color: var(--text); cursor: pointer; font-size: 15px; }
  .btns button:hover { border-color: var(--accent); }

  .opts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .opts label { display: flex; align-items: center; gap: 8px; }
  .opts input[type=text], .opts input[type=number] {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  #name { width: 180px; } #limit { width: 70px; }
  .hint { color: var(--muted); font-size: 13px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .primary { padding: 12px 22px; border: 0; border-radius: 10px; background: var(--accent);
             color: var(--accent-text); font: 600 16px system-ui, sans-serif; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: default; }
  .ghost { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px;
           background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  #status { margin-top: 14px; min-height: 1.4em; }
  #status.err { color: var(--err); } #status.ok { color: var(--ok); }
  #status a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Фото → PDF</h1>
  <p class="sub">Все фото собираются в один PDF не больше заданного размера. Файлы никуда не загружаются, всё делается в браузере.</p>

  <label id="drop" class="drop">
    <input type="file" id="file" accept="image/*" multiple hidden>
    <strong>Нажмите, чтобы выбрать фото, или перетащите их сюда</strong>
    <span>JPG, PNG, WEBP. Порядок страниц меняется перетаскиванием или стрелками</span>
  </label>

  <div id="list" class="list"></div>

  <section class="opts">
    <label>Имя файла <input type="text" id="name" value="документ"></label>
    <label>Лимит, МБ <input type="number" id="limit" value="10" min="1" step="0.5"></label>
    <label><input type="checkbox" id="gray"> Чёрно-белый «скан»</label>
    <span class="hint">Ч/б делает текст контрастнее и файл меньше, поэтому в лимит влезает больше страниц в хорошем качестве.</span>
  </section>

  <div class="actions">
    <button id="make" class="primary" disabled>Создать PDF</button>
    <button id="clear" class="ghost" hidden>Очистить</button>
  </div>
  <div id="status"></div>
</main>

<script>
// Уровни сжатия: [длинная сторона в px, качество JPEG]. Идём сверху вниз,
// пока PDF не влезет в лимит. 2000 px на A4 ≈ 170 dpi, текст читается свободно.
const LEVELS = [
  [2600, .85], [2400, .80], [2200, .75], [2000, .70], [1800, .65],
  [1600, .60], [1450, .55], [1300, .50], [1150, .45], [1000, .40],
];
const READABLE_SIDE = 1600; // ниже предупреждаем, что мелкий текст может читаться хуже

const items = []; // { id, file, rot, thumb }
let nextId = 0, busy = false, lastUrl = null;

const $ = id => document.getElementById(id);
const listEl = $('list'), statusEl = $('status');

function setStatus(html, cls = '') { statusEl.className = cls; statusEl.innerHTML = html; }
const mb = b => (b / 1e6).toFixed(2).replace('.', ',') + ' МБ';

// ---------- загрузка и превью ----------
async function decode(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    // запасной путь: <img> тоже учитывает EXIF-поворот в современных браузерах
    return await new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
}

async function addFiles(files) {
  const bad = [];
  for (const f of files) {
    if (f.type && !f.type.startsWith('image/')) { bad.push(f.name); continue; }
    try {
      const src = await decode(f);
      const c = drawPage(src, 360, 0, false);
      src.close?.();
      items.push({ id: ++nextId, file: f, rot: 0, thumb: c.toDataURL('image/jpeg', .75) });
      render();
    } catch { bad.push(f.name); }
  }
  if (bad.length) setStatus(`Не удалось открыть: ${bad.map(esc).join(', ')}. ` +
    `Если это HEIC с iPhone, сохраните фото как JPG (или выберите «Наиболее совместимый» формат в настройках камеры).`, 'err');
  else setStatus('');
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  listEl.innerHTML = '';
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item'; el.draggable = true; el.dataset.id = it.id;
    el.innerHTML = `
      <span class="num">${i + 1}</span>
      <div class="thumb"><img src="${it.thumb}" style="transform:rotate(${it.rot}deg)${it.rot % 180 ? ' scale(.72)' : ''}"></div>
      <div class="fname" title="${esc(it.file.name)}">${esc(it.file.name)}</div>
      <div class="btns">
        <button data-a="left" title="Раньше">←</button>
        <button data-a="rot" title="Повернуть">⟳</button>
        <button data-a="right" title="Позже">→</button>
        <button data-a="del" title="Удалить">✕</button>
      </div>`;
    listEl.appendChild(el);
  });
  $('make').disabled = busy || !items.length;
  $('clear').hidden = !items.length;
}

listEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  const i = items.findIndex(it => it.id == b.closest('.item').dataset.id);
  const a = b.dataset.a;
  if (a === 'del') items.splice(i, 1);
  else if (a === 'rot') items[i].rot = (items[i].rot + 90) % 360;
  else if (a === 'left' && i > 0) items.splice(i - 1, 0, items.splice(i, 1)[0]);
  else if (a === 'right' && i < items.length - 1) items.splice(i + 1, 0, items.splice(i, 1)[0]);
  render();
});

// перетаскивание карточек для смены порядка
let dragId = null;
listEl.addEventListener('dragstart', e => {
  const el = e.target.closest('.item'); if (!el) return;
  dragId = el.dataset.id; el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
});
listEl.addEventListener('dragend', () => { dragId = null; render(); });
listEl.addEventListener('dragover', e => {
  if (!dragId) return; e.preventDefault();
  listEl.querySelectorAll('.target').forEach(x => x.classList.remove('target'));
  e.target.closest('.item')?.classList.add('target');
});
listEl.addEventListener('drop', e => {
  if (!dragId) return; e.preventDefault(); e.stopPropagation();
  const t = e.target.closest('.item'); if (!t || t.dataset.id === dragId) return;
  const from = items.findIndex(it => it.id == dragId);
  const to = items.findIndex(it => it.id == t.dataset.id);
  items.splice(to, 0, items.splice(from, 1)[0]); // карточка встаёт на место целевой
  dragId = null; render();
});

// выбор и перетаскивание файлов
$('file').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragover', e => { if (isFileDrag(e)) { e.preventDefault(); $('drop').classList.add('over'); } });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').classList.remove('over'); });
window.addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault(); $('drop').classList.remove('over');
  if (!busy) addFiles([...e.dataTransfer.files]);
});
$('clear').addEventListener('click', () => { if (!busy) { items.length = 0; render(); setStatus(''); } });

// ---------- обработка изображения ----------
function drawPage(src, maxSide, rot, gray) {
  const sw = src.width, sh = src.height;
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));

  // сильное уменьшение делаем в несколько шагов по половине, чтобы текст не «рассыпался»
  let cur = src, cw = sw, ch = sh;
  while (cw / 2 > w) {
    cw = Math.round(cw / 2); ch = Math.round(ch / 2);
    const t = document.createElement('canvas'); t.width = cw; t.height = ch;
    const tc = t.getContext('2d'); tc.imageSmoothingQuality = 'high';
    tc.drawImage(cur, 0, 0, cw, ch); cur = t;
  }

  const swap = rot % 180 !== 0;
  const c = document.createElement('canvas');
  c.width = swap ? h : w; c.height = swap ? w : h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(cur, -w / 2, -h / 2, w, h);
  if (gray) toScan(ctx, c.width, c.height);
  return c;
}

// оттенки серого + автоуровни: растягиваем диапазон яркостей (1%..99%) на весь 0..255
function toScan(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;
  const hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const y = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
    d[i] = y; hist[y]++;
  }
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * .01) lo++;
  acc = 0;
  while (hi > 0 && (acc += hist[hi]) < n * .01) hi--;
  if (hi - lo < 32) { lo = 0; hi = 255; }
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) lut[v] = (v - lo) * 255 / (hi - lo);
  for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = lut[d[i]];
  ctx.putImageData(img, 0, 0);
}

const toJpeg = (c, q) => new Promise((res, rej) =>
  c.toBlob(b => b ? b.arrayBuffer().then(a => res(new Uint8Array(a)), rej) : rej(new Error('toBlob')), 'image/jpeg', q));

// ---------- сборка PDF (без библиотек: JPEG кладётся в PDF как есть) ----------
function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, ...body) => { offs[n] = len; push(`${n} 0 obj\n`); body.forEach(push); push('\nendobj\n'); };

  push('%PDF-1.4\n%âãÏÓ\n');
  const n = pages.length;
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`);
  pages.forEach((p, i) => {
    const pn = 3 + 3 * i, A4 = 841.89; // длинная сторона страницы = длинной стороне A4
    const s = A4 / Math.max(p.w, p.h);
    const W = (p.w * s).toFixed(2), H = (p.h * s).toFixed(2);
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] ` +
            `/Resources << /XObject << /Im0 ${pn + 2} 0 R >> >> /Contents ${pn + 1} 0 R >>`);
    obj(pn + 1, `<< /Length ${cs.length} >>\nstream\n`, cs, '\nendstream');
    obj(pn + 2, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB ` +
                `/BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`, p.jpg, '\nendstream');
  });
  const xref = len, total = 3 + 3 * n;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

// ---------- подбор сжатия под лимит ----------
async function makePdf() {
  const limitMb = parseFloat($('limit').value) || 10;
  const gray = $('gray').checked;
  // 1 МБ считаем как 1 000 000 байт и оставляем 2% запаса: так файл пройдёт любую проверку «до 10 МБ»
  const budget = limitMb * 1e6 * .98 - 600 * items.length - 2000;

  let li = 0, attempt = 0;
  while (li < LEVELS.length) {
    const [side, q] = LEVELS[li];
    const pages = [];
    let total = 0, done = 0;
    attempt++;
    for (let i = 0; i < items.length; i++) {
      setStatus(`Сжатие: попытка ${attempt}, фото ${i + 1} из ${items.length}…`);
      const src = await decode(items[i].file);
      const c = drawPage(src, side, items[i].rot, gray);
      src.close?.();
      const jpg = await toJpeg(c, q);
      c.width = c.height = 0; // освобождаем память сразу
      pages.push({ jpg, ...jpgSize(jpg) });
      total += jpg.length; done++;
      if (total > budget) break; // этот уровень уже не влезет
    }
    if (done === items.length && total <= budget) return { blob: buildPdf(pages), side, q };

    // Оцениваем полный размер на этом уровне и сразу переходим к уровню,
    // который по оценке влезет (на одну ступень выше — вдруг оценка пессимистична).
    const estimate = total * items.length / done;
    let next = li + 1;
    while (next < LEVELS.length - 1 && estimate * relSize(LEVELS[next]) / relSize(LEVELS[li]) > budget) next++;
    li = Math.max(li + 1, next - 1);
  }
  return null;
}

// примерный относительный размер JPEG для уровня: площадь × поправка на качество
const Q_FACTOR = { .85: 1, .8: .85, .75: .75, .7: .67, .65: .6, .6: .55, .55: .5, .5: .46, .45: .42, .4: .38 };
const relSize = ([side, q]) => side * side * (Q_FACTOR[q] ?? q);

// размеры берём прямо из JPEG-заголовка (маркер SOF), чтобы точно совпадали с картинкой
function jpgSize(b) {
  let i = 2;
  while (i < b.length) {
    if (b[i] !== 0xFF) { i++; continue; }
    const m = b[i + 1], L = (b[i + 2] << 8) | b[i + 3];
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC)
      return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8] };
    i += 2 + L;
  }
  throw new Error('bad jpeg');
}

const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPad прикидывается Mac
let lastFile = null;
function canShareFile(file) {
  try { return !!navigator.canShare?.({ files: [file] }); } catch { return false; }
}

statusEl.addEventListener('click', async e => {
  if (!e.target.closest('[data-share]') || !lastFile) return;
  try {
    await navigator.share({ files: [lastFile], title: lastFile.name });
  } catch (err) {
    if (err.name === 'AbortError') return; // пользователь просто закрыл меню
    // меню «Поделиться» недоступно — пробуем обычное скачивание
    const a = document.createElement('a'); a.href = lastUrl; a.download = lastFile.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
});

$('make').addEventListener('click', async () => {
  if (busy || !items.length) return;
  busy = true; render();
  try {
    const t0 = performance.now();
    const res = await makePdf();
    if (!res) {
      setStatus('Не получилось уложиться в лимит даже при сильном сжатии. Включите «Чёрно-белый скан», увеличьте лимит или разделите фото на несколько PDF.', 'err');
      return;
    }
    const name = ($('name').value.trim() || 'документ').replace(/[\\/:*?"<>|]+/g, '_').replace(/\.pdf$/i, '') + '.pdf';
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(res.blob);
    lastFile = new File([res.blob], name, { type: 'application/pdf' });

    // На телефонах отдаём файл через системное меню «Поделиться»: во встроенных браузерах
    // (Telegram на iPhone и т.п.) обычное скачивание открывает ссылку blob:, а не сам файл.
    // Меню можно открыть только по нажатию, поэтому показываем отдельную кнопку.
    const share = IS_MOBILE && canShareFile(lastFile);
    if (!share) {
      const a = document.createElement('a'); a.href = lastUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }
    const warn = res.side < READABLE_SIDE
      ? '<br>Фото пришлось заметно уменьшить, мелкий текст может читаться хуже. Попробуйте «Чёрно-белый скан» или разделите на 2 файла.' : '';
    setStatus(`Готово: <b>${esc(name)}</b>, ${items.length} стр., ${mb(res.blob.size)} ` +
      `(${res.side}px, качество ${Math.round(res.q * 100)}%, ${((performance.now() - t0) / 1000).toFixed(1)} с).` +
      (share
        ? `<div class="actions"><button class="primary" data-share>Поделиться / Сохранить PDF</button></div>`
        : ` <a href="${lastUrl}" target="_blank">Открыть</a> · <a href="${lastUrl}" download="${esc(name)}">Скачать ещё раз</a>`) +
      (IS_MOBILE && !share
        ? '<br>Если файл не сохраняется, откройте эту страницу в Safari или Chrome (меню ⋯ → «Открыть в браузере»).' : '') +
      warn,
      res.side < READABLE_SIDE ? 'err' : 'ok');
  } catch (e) {
    console.error(e);
    setStatus('Ошибка при создании PDF: ' + esc(String(e.message || e)), 'err');
  } finally {
    busy = false; render();
  }
});
</script>
</body>
</html>
